[build-system]
requires = [
    "setuptools>=68",
    "tomli>=2; python_version < '3.11'",
]
# __legacy__ executes the tiny setup.py shim so pip versions that do not load
# pyproject-only repository roots still honour the PEP 621 metadata below.
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "temporal-diffusion-policy"
version = "0.1.0"
description = "Temporal conditioning for diffusion-based robotic imitation learning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "licenses/LICENSE" }
authors = [{ name = "Temporal Diffusion Policy contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "diffusers==0.18.2",
    "draccus==0.11.5",
    "einops==0.8.1",
    "gym==0.26.2",
    "gymnasium==1.3.0",
    "h5py==3.12.1",
    "huggingface-hub==0.25.2",
    "imageio==2.37.3",
    "matplotlib==3.10.0",
    "numcodecs==0.10.2",
    "numpy>=2.0.0",
    "opencv-python==4.13.0.92",
    "pygame==2.1.2",
    "pymunk==6.2.1",
    "python-dotenv==1.2.1",
    "scikit-image==0.25.2",
    "scikit-learn==1.6.1",
    "scikit-video==1.1.11",
    "scipy==1.15.1",
    "shapely==1.8.4",
    "tqdm==4.64.1",
    "wandb==0.25.0",
    "zarr<3",
]

[project.optional-dependencies]
# Install a CUDA-specific torch wheel first when GPU support is required.
torch = [
    "torch==2.9.1",
    "torchvision==0.24.1",
]
robosuite = [
    "mujoco==3.5.0",
    "hidapi==0.14.0",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@95743f6687ad7394ccb6e865fa4e1b99114e580d",
]
realworld = [
    "pyaudio>=0.2.14",
    "pynput>=1.7.7",
]
dev = [
    "build>=1.2",
    "pytest>=8",
]

[project.scripts]
tdp = "temporal_diffusion_policy.experiment_cli:main"
tdp-train = "temporal_diffusion_policy.training:main"
tdp-infer = "temporal_diffusion_policy.inference:main"
tdp-collect-pygame = "temporal_diffusion_policy.data_collection_pygame:main"
tdp-collect-robosuite = "temporal_diffusion_policy.data_collection_robosuite:main"
tdp-collect-realworld = "temporal_diffusion_policy.data_collection_realenv:main"
tdp-analyze-waittime = "temporal_diffusion_policy.analysis.waittime:main"
tdp-check-progress = "temporal_diffusion_policy.scripts.check_progress:main"
tdp-clean-checkpoints = "temporal_diffusion_policy.scripts.clean_checkpoints:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["temporal_diffusion_policy*"]

[tool.setuptools.package-data]
"temporal_diffusion_policy.envs.realworld.tts" = ["*.wav"]
"temporal_diffusion_policy.analysis" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-vv -s"
